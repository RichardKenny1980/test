name: Void Siege web deploy

# Publishes the phone/browser build to GitHub Pages whenever main changes.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["void_siege/**", ".github/workflows/void-siege*.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag
      - run: python -m void_siege.build_web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/voidsiege/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
