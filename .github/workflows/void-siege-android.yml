name: Void Siege Android

# Builds the Android app with buildozer / python-for-android, boots it in an emulator to
# check it starts, and on main publishes the APK to the "android-latest" release.
on:
  push:
    branches: [main]
    paths: ["void_siege/**", ".github/workflows/void-siege-android.yml"]
  pull_request:
    paths: ["void_siege/**", ".github/workflows/void-siege-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake unzip zip
      - run: pip install buildozer cython pygame-ce
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            build/android/.buildozer
          key: buildozer-${{ hashFiles('void_siege/android/buildozer.spec') }}
      - run: python -m void_siege.build_android
      - name: Build APK
        working-directory: build/android
        run: yes | buildozer -v android debug
      - run: mv build/android/bin/*.apk build/android/bin/void-siege.apk
      - uses: actions/upload-artifact@v4
        with:
          name: void-siege-apk
          path: build/android/bin/void-siege.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: void-siege-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android_smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: android-smoke

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: emulator
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: void-siege-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Void Siege for Android (latest)
          prerelease: false
          make_latest: true
          body: |
            Tap **void-siege.apk** below on your Android phone to download it, then open it to install.
            Android will ask you to allow installing apps from your browser the first time.
          files: void-siege.apk
